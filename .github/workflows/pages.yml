name: Deploy static notebook

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: demo/energy-simulator/package-lock.json
      - name: Check notebook language persistence
        run: node --test tests/*.test.cjs
      - name: Validate demo
        working-directory: demo/energy-simulator
        run: |
          npm ci
          npm test
          npm run lint
          npm run build

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Cache-bust own JS/CSS assets
        env:
          SHA: ${{ github.sha }}
        run: |
          grep -rlE '(href|src)="[^"]*(styles\.css|main\.js|translations\.js|notes-lang\.js)"' --include="*.html" . | while read -r f; do
            sed -i -E "s#(href|src)=\"([^\"]*(styles\.css|main\.js|translations\.js|notes-lang\.js))\"#\1=\"\2?v=${SHA}\"#g" "$f"
          done

      - name: Prepare static artifact
        run: |
          mkdir _site
          cp *.html *.js *.css *.pdf *.webp *.png favicon.svg robots.txt sitemap.xml _headers _site/
          cp -R assets notes journal _site/
          rsync -a --exclude=node_modules --exclude=tests --exclude='package*.json' --exclude=README.md --exclude=eslint.config.js --exclude=jsconfig.json --exclude=verify-build.js demo _site/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
